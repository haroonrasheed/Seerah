<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Seerah themed wallpaper with soft sky and desert tones">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecf7ff" />
      <stop offset="45%" stop-color="#f4efd9" />
      <stop offset="100%" stop-color="#ecd2a5" />
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="-8%" r="70%">
      <stop offset="0%" stop-color="#dff2ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#dff2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="108%" r="70%">
      <stop offset="0%" stop-color="#f6e4c5" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f6e4c5" stop-opacity="0" />
    </radialGradient>

    <pattern id="arabesqueGrid" width="220" height="220" patternUnits="userSpaceOnUse">
      <g stroke="#d4c29f" stroke-width="1.4" fill="none" opacity="0.35">
        <circle cx="110" cy="110" r="58" />
        <circle cx="110" cy="110" r="23" />
        <path d="M110 35 L110 185 M35 110 L185 110" />
        <path d="M59 59 L161 161 M161 59 L59 161" />
        <path d="M110 52 L122 84 L156 84 L129 103 L139 135 L110 115 L81 135 L91 103 L64 84 L98 84 Z" />
      </g>
    </pattern>

    <linearGradient id="sandBand1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6e4c5" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#ecd2a5" stop-opacity="0.68" />
    </linearGradient>
    <linearGradient id="sandBand2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecd2a5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f6e4c5" stop-opacity="0.56" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1400" fill="url(#bgGrad)" />
  <rect width="1920" height="1400" fill="url(#topGlow)" />
  <rect width="1920" height="1400" fill="url(#bottomGlow)" />

  <path d="M0 450 C220 410 430 480 640 452 C870 422 1060 500 1285 465 C1480 436 1710 492 1920 450 L1920 620 L0 620 Z" fill="url(#sandBand1)" />
  <path d="M0 710 C280 660 500 755 760 720 C1060 680 1300 760 1580 726 C1700 710 1820 738 1920 720 L1920 900 L0 900 Z" fill="url(#sandBand2)" />
  <path d="M0 980 C250 940 470 1020 700 990 C930 960 1210 1038 1450 1005 C1625 982 1770 1020 1920 995 L1920 1185 L0 1185 Z" fill="url(#sandBand1)" opacity="0.75" />

  <rect width="1920" height="1400" fill="url(#arabesqueGrid)" />

  <g fill="#d6c097" opacity="0.26">
    <circle cx="230" cy="170" r="68" />
    <circle cx="1710" cy="210" r="78" />
    <circle cx="1520" cy="1060" r="74" />
    <circle cx="360" cy="1140" r="62" />
